name: merge-stickers
description: 내가 머지시킨 오픈소스 PR을 칭찬스티커판처럼 README에 붙여줍니다
author: htjworld
branding:
  icon: award
  color: orange
inputs:
  token:
    description: GitHub 토큰. visibility가 all이면 repo 스코프 PAT가 필요합니다.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/cache@v4
      with:
        path: .merge-stickers/cache
        key: merge-stickers-cache-${{ github.run_id }}
        restore-keys: merge-stickers-cache-
    # npm 배포 없이 액션 저장소 코드를 그대로 빌드해서 쓴다
    - name: build merge-stickers
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci && npm run build
    - name: fetch and render
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        node "${{ github.action_path }}/dist/cli.js" fetch
        node "${{ github.action_path }}/dist/cli.js" render
        node "${{ github.action_path }}/dist/cli.js" check
    - name: commit if changed
      shell: bash
      run: |
        git add -A -- . ':!.merge-stickers/cache'
        if git diff --cached --quiet; then echo "no changes"; exit 0; fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "chore: update merge-stickers"
        git push
