name: Merge Stickers
description: Turn every open-source PR you got merged into a collectible sticker on your GitHub profile README.
author: htjworld
branding:
  icon: award
  color: purple
inputs:
  token:
    description: GitHub token. Use a PAT with the repo scope to include private PRs.
    default: ${{ github.token }}
  # Values below come from the Run workflow form. Empty or "keep" leaves config.yml unchanged.
  visibility:
    description: public | private | all
    default: ""
  private_display:
    description: mask | hide | show
    default: ""
  theme:
    description: paper | holo | midnight | minimal
    default: ""
  sticker_color:
    description: unique (a different color per sticker) or #RRGGBB
    default: ""
  merged_color:
    description: auto (default color) | random | #RRGGBB (header MERGED PRs number)
    default: ""
  repos_color:
    description: auto (default color) | random | #RRGGBB (header REPOS number)
    default: ""
  third_color:
    description: auto (default color) | random | #RRGGBB (header third number)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/cache@v4
      with:
        path: .merge-stickers/cache
        key: merge-stickers-cache-${{ github.run_id }}
        restore-keys: merge-stickers-cache-
    # Builds the action's own source; no npm publish needed
    - name: build merge-stickers
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci && npm run build
    - name: apply settings
      shell: bash
      env:
        V_VISIBILITY: ${{ inputs.visibility }}
        V_PRIVATE: ${{ inputs.private_display }}
        V_THEME: ${{ inputs.theme }}
        V_STICKER: ${{ inputs.sticker_color }}
        V_MERGED: ${{ inputs.merged_color }}
        V_REPOS: ${{ inputs.repos_color }}
        V_THIRD: ${{ inputs.third_color }}
      run: |
        node "${{ github.action_path }}/dist/cli.js" set \
          "visibility=$V_VISIBILITY" "private.display=$V_PRIVATE" "theme=$V_THEME" "sticker.color=$V_STICKER" \
          "header.colors.merged=$V_MERGED" "header.colors.repos=$V_REPOS" "header.colors.third=$V_THIRD"
    - name: fetch and render
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        node "${{ github.action_path }}/dist/cli.js" fetch
        node "${{ github.action_path }}/dist/cli.js" render
        node "${{ github.action_path }}/dist/cli.js" check
    - name: commit if changed
      shell: bash
      run: |
        git add -A
        git reset -q -- .merge-stickers/cache || true
        if git diff --cached --quiet; then echo "no changes"; exit 0; fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "chore: update merge-stickers"
        git push
