# yaml-language-server: $schema=https://raw.githubusercontent.com/htjworld/merge-stickers/main/schema/merge-stickers.schema.json
# ⚠ After saving this file, press the fetch button in your README (Actions > Run workflow) to apply it!
#    (The Run workflow form can change the same settings too.)
# merge-stickers settings. This is the only file a human (or Claude Code) edits.
# Local preview after editing: npx github:htjworld/merge-stickers render  (redraws without network)
# Leave user out to auto-detect it (Actions: repo owner, local: token owner).
# user: your-login
timezone: UTC                # e.g. Asia/Seoul, America/New_York

visibility: __VISIBILITY__   # public (public only) | private (private only) | all. private/all need a repo-scope PAT
private:
  display: mask              # mask (lock icon, name removed) | hide | show

include:
  own: false                 # also count merges into repos you own
  owners: []                 # empty = everyone
exclude:
  repos: []                  # e.g. ["my-company/*"]
  prs: []                    # e.g. ["owner/repo#123"] (current name, old name or PR id)
  titleContains: []
  before: null               # e.g. 2022-01-01
  minStars: 0

layout:
  columns: 10
  slots: auto                # auto | a number | none
  order: asc                 # asc | desc
  groupBy: pr                # pr (one sticker per PR; the Nth merge into a repo sets its tier) | repo (one per repo + xN)

header:
  stat: stars                # third stat: stars (total stars of repos you merged into) | since | latest | owners
  colors:                    # header number colors: auto (default trio #72C9F7 #1EE1A0 #EB2D7D) | random | "#RRGGBB"
    merged: auto
    repos: auto
    third: auto
  buttons: true              # settings (left) and fetch (right) buttons. Everyone sees them, only you can use them
  # settingsUrl: https://...   # override button links (default: config.yml edit page, workflow run page)
  # fetchUrl: https://...

theme: paper                 # paper | holo | midnight | minimal
sticker:
  size: 72
  variation: 0.6             # 0 (neat rows) ~ 1 (free-spirited)
  image: auto                # auto (README first image > social preview > avatar) | readme | social | avatar | language
  animate: true              # shine on bronze and above (off = still image)
  color: unique              # color-tier border: unique (each sticker its own color) | one "#RRGGBB" for all
  tier: auto                 # auto | white color bronze silver gold platinum diamond (pin every sticker to one tier)
  thresholds:                # how many PRs into a repo unlock each tier
    bronze: 10
    silver: 20
    gold: 30
    platinum: 40
    diamond: 50

output:
  mode: html                 # html (clickable) | table | sheet
  dir: assets/merge-stickers
  readme: README.md

# Per-sticker overrides
# stickers:
#   "owner/repo":              # a repo name styles all its stickers, "owner/repo#123" styles one PR
#     color: "#FF6B6B"       # color-tier border (default: a unique color per sticker)
#     tier: diamond          # force a tier (white color bronze silver gold platinum diamond)
#     shape: star-badge      # circle squircle rounded-square hexagon star-badge shield cloud scallop
#     finish: holo           # glossy matte holo foil
#     rotate: 8
#     image: ./assets/my-logo.png
#     hidden: false
stickers: {}
