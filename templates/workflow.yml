name: merge-stickers
on:
  schedule:
    - cron: "0 18 * * 0" # 매주 일요일 UTC 18시 = 월요일 KST 새벽 3시
  workflow_dispatch:
    # README의 fetch 버튼 > Run workflow 를 누르면 뜨는 이 폼이 설정창입니다.
    # 값을 고르면 config.yml에 저장되어 이후 매주 자동 실행에도 유지됩니다. keep은 "바꾸지 않음".
    inputs:
      visibility:
        description: "보기: public(공개만) / private(비공개만, repo 스코프 PAT 필요) / all(전부)"
        type: choice
        options: [keep, public, private, all]
        default: keep
      private_display:
        description: "비공개 PR 표시: mask(자물쇠, 이름 숨김) / hide(숨김) / show(그대로)"
        type: choice
        options: [keep, mask, hide, show]
        default: keep
      theme:
        description: "테마"
        type: choice
        options: [keep, paper, holo, midnight, minimal]
        default: keep
      sticker_color:
        description: "스티커 테두리색: unique(모든 스티커 다른 색) 또는 #RRGGBB 하나로 통일 (keep=유지)"
        type: string
        default: keep
      merged_color:
        description: "MERGED PRs 숫자 색: auto(기본색) / random(랜덤) / #RRGGBB (keep=유지)"
        type: string
        default: keep
      repos_color:
        description: "REPOS 숫자 색: auto(기본색) / random(랜덤) / #RRGGBB (keep=유지)"
        type: string
        default: keep
      third_color:
        description: "STARS 숫자 색: auto(기본색) / random(랜덤) / #RRGGBB (keep=유지)  |  ⚠ 설정을 고른 뒤 아래 Run workflow 버튼을 눌러야 적용됩니다!"
        type: string
        default: keep
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: htjworld/merge-stickers@main
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          visibility: ${{ inputs.visibility }}
          private_display: ${{ inputs.private_display }}
          theme: ${{ inputs.theme }}
          sticker_color: ${{ inputs.sticker_color }}
          merged_color: ${{ inputs.merged_color }}
          repos_color: ${{ inputs.repos_color }}
          third_color: ${{ inputs.third_color }}
