name: merge-stickers
on:
  schedule:
    - cron: "0 18 * * 0" # weekly, Sunday 18:00 UTC
  workflow_dispatch:
    # This form is the settings panel: README fetch button > Run workflow.
    # Picked values are saved to config.yml and kept for later scheduled runs. "keep" means "don't change".
    inputs:
      visibility:
        description: "Show: public (public only) / private (private only, needs a repo-scope PAT) / all"
        type: choice
        options: [keep, public, private, all]
        default: keep
      private_display:
        description: "Private PRs: mask (lock icon, name hidden) / hide / show (as is)"
        type: choice
        options: [keep, mask, hide, show]
        default: keep
      theme:
        description: "Theme"
        type: choice
        options: [keep, paper, holo, midnight, minimal]
        default: keep
      sticker_color:
        description: "Sticker border: unique (every sticker its own color) or one #RRGGBB for all (keep = no change)"
        type: string
        default: keep
      merged_color:
        description: "MERGED PRs number color: auto (default) / random / #RRGGBB (keep = no change)"
        type: string
        default: keep
      repos_color:
        description: "REPOS number color: auto (default) / random / #RRGGBB (keep = no change)"
        type: string
        default: keep
      third_color:
        description: "STARS number color: auto (default) / random / #RRGGBB (keep = no change)  |  ⚠ Press the Run workflow button below to apply!"
        type: string
        default: keep
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: htjworld/merge-stickers@v1
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          visibility: ${{ inputs.visibility }}
          private_display: ${{ inputs.private_display }}
          theme: ${{ inputs.theme }}
          sticker_color: ${{ inputs.sticker_color }}
          merged_color: ${{ inputs.merged_color }}
          repos_color: ${{ inputs.repos_color }}
          third_color: ${{ inputs.third_color }}
