name: merge-stickers
on:
  schedule:
    - cron: "0 18 * * *" # UTC 18시 = KST 새벽 3시
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: htjworld/merge-stickers@v1
        with:
          token: ${{ secrets.GH_PAT || github.token }}
